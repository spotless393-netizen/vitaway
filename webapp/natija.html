<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>20 kunlik natija</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1E9BEF;--blue-d:#0B6FC0;--green:#9BC53D;--yellow:#F2C311;--orange:#FF8A00;--ink:#17324D;--muted:#5A7690;--bg:#F4F9FD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translate(14px,-18px) scale(1.06)}}
.top{position:fixed;left:0;right:0;top:0;z-index:3;padding:14px 18px 0;display:flex;align-items:center;gap:12px}
.back{border:0;background:#fff;border-radius:12px;width:38px;height:38px;font-size:18px;box-shadow:0 2px 8px rgba(11,111,192,.12);visibility:hidden}
.bar{flex:1;height:10px;background:#DCEBF7;border-radius:9px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:9px;transition:width .45s}
.stage{position:fixed;inset:64px 0 0;z-index:2}
.q{position:absolute;inset:0;padding:10px 20px 30px;display:flex;flex-direction:column;justify-content:center;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .35s;overflow-y:auto}
.q.right{transform:translateX(110%);opacity:0}.q.left{transform:translateX(-110%);opacity:0}
.emo{font-size:64px;text-align:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
h2{font-size:26px;line-height:1.2;text-align:center;margin:12px 0 6px}
p.sub{text-align:center;color:var(--muted);margin:0 0 18px;font-size:16px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:18px;padding:13px 16px;font:500 17px 'Fredoka',sans-serif;color:var(--ink);text-align:left;box-shadow:0 3px 10px rgba(11,111,192,.08);cursor:pointer;transition:transform .12s,border-color .2s,background .2s;animation:in .4s both}
.opt span{font-size:28px;width:34px;text-align:center}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--blue);background:#EAF5FD}
@keyframes in{from{transform:translateY(14px);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chips .opt{padding:12px 18px}
input,textarea{width:100%;border:2px solid #DCEBF7;border-radius:16px;padding:14px;font:500 17px 'Fredoka',sans-serif;color:var(--ink);background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:130px;resize:none}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;font:600 18px 'Fredoka',sans-serif;cursor:pointer;margin-top:16px;background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--blue-d)}
.btn.ghost{background:transparent;color:var(--blue-d);box-shadow:none;margin-top:6px}
.btn.orange{background:var(--orange);box-shadow:0 6px 0 #C46800}
.stars{display:flex;justify-content:center;gap:8px;font-size:46px}
.stars button{border:0;background:none;font-size:46px;filter:grayscale(1);opacity:.45;transition:transform .2s,filter .2s,opacity .2s;cursor:pointer;padding:0}
.stars button.on{filter:none;opacity:1;transform:scale(1.12)}
.badge{width:150px;height:150px;margin:0 auto;border-radius:50%;background:conic-gradient(var(--green),var(--yellow),var(--orange),var(--blue),var(--green));display:flex;align-items:center;justify-content:center;animation:spin 8s linear infinite}
.badge div{width:122px;height:122px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:spin 8s linear infinite reverse}
.badge b{font-size:56px;line-height:1;color:var(--blue)}.badge small{font-size:15px;color:var(--muted);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>

steps.push({id:'stars', r:()=>`
  <div class="emo">⭐</div><h2>Vitaway'dan qanchalik mamnunsiz?</h2><p class="sub">Yulduzchani bosing</p>
  <div class="stars">${[1,2,3,4,5].map(n=>`<button class="${A.stars>=n?'on':''}" data-star="${n}">⭐</button>`).join('')}</div>
  <p class="hint" id="starTxt">${starLabel(A.stars)}</p>`});
steps.push({id:'rec', r:()=>`
  <div class="emo">🤝</div><h2>Do'stlaringizga tavsiya qilasizmi?</h2><p class="sub">&nbsp;</p>
  <div class="opts">${[['😍','Ha, albatta'],['🤔','Balki'],['🙅',"Yo'q"]].map((o,i)=>`<button class="opt ${A.rec===o[1]?'sel':''}" style="animation-delay:${i*.06}s" data-set="rec" data-v="${o[1]}"><span>${o[0]}</span>${o[1]}</button>`).join('')}</div>`});
steps.push({id:'ok', r:()=>`
  <div class="emo">📣</div><h2>Fikringizni boshqa ota-onalarga ko'rsatsak bo'ladimi?</h2>
  <p class="sub">Vitaway sahifalari va kanallarida</p>
  <div class="opts">${[['✅','Ha, ismim bilan'],['🙈','Ha, lekin ismsiz'],['🔒',"Yo'q, faqat siz uchun"]].map((o,i)=>`<button class="opt ${A.ok===o[1]?'sel':''}" style="animation-delay:${i*.06}s" data-set="ok" data-v="${o[1]}"><span>${o[0]}</span>${o[1]}</button>`).join('')}</div>`});
steps.push({id:'end', r:()=>`
  <div class="emo" style="font-size:80px">💚</div><h2>Katta rahmat!</h2>
  <p class="sub">${summary()}</p>
  <button class="btn orange" id="send">Yuborish ✨</button>`});

function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function starLabel(n){return ['','Yomon','Qoniqarsiz','Yaxshi','Juda yaxshi','Ajoyib! 🤩'][n]||'';}
function summary(){
  const better=Object.values(A.sc).filter(v=>v>=2).length;
  return better? `Siz ${areas.length} ta yo'nalishdan <b>${better} tasida</b> yaxshilanish sezdingiz. Natijangizni yuboring.` : 'Natijangizni yuboring, mutaxassislarimiz ko\'rib chiqadi.';
}

// Navigatsiya
const stage=document.getElementById('stage'); let cur=-1, el=null;
function go(i, dir=1){
  if(i<0||i>=steps.length) return;
  const old=el; cur=i;
  el=document.createElement('div'); el.className='q '+(dir>0?'right':'left'); el.innerHTML=steps[i].r(); stage.appendChild(el);
  bind(el); el.offsetHeight; el.classList.remove('right','left');
  if(old){ old.classList.add(dir>0?'left':'right'); setTimeout(()=>old.remove(),450); }
  document.getElementById('bar').style.width=(i/(steps.length-1)*100)+'%';
  document.getElementById('back').style.visibility=(i>0&&i<steps.length)?'visible':'hidden';
  if(steps[i].id==='end') confetti();
}
const next=()=>setTimeout(()=>go(cur+1,1),260);
document.getElementById('back').onclick=()=>go(cur-1,-1);

function bind(root){
  root.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{hap();go(cur+1,1);});
  root.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ A[b.dataset.set]=b.dataset.v; mark(b); hap(); next(); });
  root.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{ A.sc[b.dataset.sc]=+b.dataset.v; mark(b); hap(); next(); });
  root.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{ A.age=b.dataset.age; root.querySelectorAll('[data-age]').forEach(x=>x.classList.toggle('sel',x===b)); hap(); });
  const cn=root.querySelector('#childNext'); if(cn) cn.onclick=()=>{ A.child=root.querySelector('#cname').value.trim(); hap(); go(cur+1,1); };
  const tn=root.querySelector('#txtNext'); if(tn) tn.onclick=()=>{ A.text=root.querySelector('#txt').value.trim(); hap(); go(cur+1,1); };
  const ts=root.querySelector('#txtSkip'); if(ts) ts.onclick=()=>{ A.text=root.querySelector('#txt').value.trim(); A.voiceLater=1; go(cur+1,1); };
  root.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{ A.stars=+b.dataset.star;
    root.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on',+x.dataset.star<=A.stars));
    root.querySelector('#starTxt').textContent=starLabel(A.stars); hap(); next(); });
  const s=root.querySelector('#send'); if(s) s.onclick=send;
}
function mark(b){ b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); }

function send(){
  hap('success');
  const json=JSON.stringify(A).slice(0,4000);
  if(inTG){ try{ tg.sendData(json); return; }catch(e){} }
  el.innerHTML=`<div class="emo">📨</div><h2>Botga yuboriladi</h2><p class="sub">Bu namuna rejimi. Telegram ichida oyna yopiladi va bot sizga o'yin taklifini yuboradi.</p>
    <textarea readonly style="min-height:160px;font-size:13px">${esc(JSON.stringify(A,null,1))}</textarea>`;
}

// Konfetti
const cf=document.getElementById('cf'), g=cf.getContext('2d'); let ps=[];
function confetti(){ cf.width=innerWidth*2; cf.height=innerHeight*2; g.setTransform(2,0,0,2,0,0);
  const cols=['#1E9BEF','#F2C311','#9BC53D','#FF8A00'];
  for(let i=0;i<110;i++) ps.push({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*620,vy:-250-Math.random()*450,a:Math.random()*6,c:cols[i%4],l:2.4});
  let last=performance.now();
  (function f(now){ const dt=Math.min(.033,(now-last)/1000); last=now; g.clearRect(0,0,innerWidth,innerHeight);
    ps=ps.filter(p=>(p.l-=dt)>0); ps.forEach(p=>{p.vy+=800*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=dt*7;
      g.save();g.translate(p.x,p.y);g.rotate(p.a);g.globalAlpha=Math.min(1,p.l);g.fillStyle=p.c;g.fillRect(-5,-3,10,6);g.restore();});
    if(ps.length) requestAnimationFrame(f); })(last);
}
go(0,1);
})();
</script>
</body>
</html>
