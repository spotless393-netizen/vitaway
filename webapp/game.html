<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vitaway savatchasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1E9BEF; --blue-d:#0B6FC0; --sky:#A9D2F0; --green:#9BC53D; --yellow:#F2C311; --orange:#FF8A00;
  --cream:#F3E2A9; --ink:#17324D; --white:#fff; --red:#E5484D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#EAF5FD;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.screen.on{display:flex}
.dim{background:rgba(23,50,77,.45);backdrop-filter:blur(3px)}
.card{background:#fff;border-radius:28px;padding:24px 20px;width:100%;max-width:380px;text-align:center;box-shadow:0 18px 50px rgba(11,111,192,.25);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
h1,h2,h3,p{margin:0}
.logoimg{display:block;width:78%;max-width:280px;margin:0 auto;animation:logoin .8s cubic-bezier(.2,1.5,.4,1) both, bob 3s 1s ease-in-out infinite}
@keyframes logoin{from{transform:scale(.3) rotate(-8deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.logo{font-weight:700;font-size:46px;letter-spacing:1px;color:var(--blue);line-height:1;transform:rotate(-4deg);text-shadow:0 3px 0 #fff,0 6px 0 rgba(11,111,192,.15)}
.tag{font-size:15px;color:var(--blue-d);margin-top:6px;font-weight:500}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px 16px;font:600 18px 'Fredoka',sans-serif;cursor:pointer;margin-top:12px;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.main{background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d)}
.btn.main:active{box-shadow:0 2px 0 var(--blue-d);transform:translateY(4px)}
.btn.ghost{background:#EAF5FD;color:var(--blue-d)}
.btn.orange{background:var(--orange);color:#fff;box-shadow:0 6px 0 #C46800}
.pill{display:inline-flex;align-items:center;gap:6px;background:#EAF5FD;border-radius:99px;padding:6px 12px;font-weight:600;font-size:15px;margin:4px}
.muted{color:#5A7690;font-size:15px;line-height:1.35}
.big{font-size:26px;font-weight:700;line-height:1.15}
.pct{font-size:56px;font-weight:700;color:var(--orange);line-height:1}
.lvl{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:5px 14px;font-weight:600;font-size:14px;letter-spacing:1px}
.prods{display:flex;justify-content:center;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.prod{width:72px;text-align:center;font-size:12px;font-weight:600;line-height:1.15}
.prod canvas{display:block;margin:0 auto 4px}
.prod small{display:block;font-weight:400;color:#5A7690;font-size:11px}
.junkrow{font-size:28px;letter-spacing:6px;margin-top:6px}
.steps{display:flex;justify-content:center;gap:6px;margin:14px 0 2px}
.steps i{width:8px;height:8px;border-radius:9px;background:#CFE4F5;display:block;transition:.3s}
.steps i.on{width:22px;background:var(--blue)}
.ladder{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.ladder div{flex:1;max-width:58px;border-radius:12px;padding:8px 0;font-weight:700;font-size:15px;color:#fff;animation:rise .6s both}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.illu{height:120px;position:relative;margin:4px 0 10px;display:flex;align-items:center;justify-content:center;font-size:54px}
.hand{position:absolute;bottom:4px;font-size:40px;animation:swipe 2s ease-in-out infinite}
.basketmini{position:absolute;bottom:34px;width:70px;height:40px;background:var(--blue);border-radius:6px 6px 18px 18px;animation:swipe 2s ease-in-out infinite}
.basketmini:after{content:'VITAWAY';position:absolute;left:0;right:0;top:12px;font-size:10px;color:#fff;font-weight:700}
@keyframes swipe{0%,100%{transform:translateX(-60px)}50%{transform:translateX(60px)}}
.heartbeat{animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
.count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:700;color:#fff;text-shadow:0 6px 0 var(--blue-d);z-index:6;pointer-events:none}
.count.on{display:flex}
.count span{animation:zoom .9s ease-out both}
@keyframes zoom{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:0}}
#toast{position:fixed;left:50%;top:118px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:600;padding:9px 16px;border-radius:14px;z-index:7;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
#sound{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;background:rgba(255,255,255,.8);border:0;border-radius:99px;width:40px;height:40px;font-size:18px;display:none}
.code{font-size:24px;font-weight:700;letter-spacing:2px;background:#FFF4E5;color:#C46800;border:2px dashed var(--orange);border-radius:14px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="toast"></div>
<button id="sound" aria-label="Ovoz">🔊</button>
<div class="count" id="count"></div>

<!-- Boshlang'ich ekran -->
<section class="screen on" id="sStart">
  <div class="card">
    <img class="logoimg" src="" alt="Vitaway: Naturally for kids">
    <h2 class="big" style="margin-top:18px">Vitaway savatchasi 🧺</h2>
    <p class="muted" style="margin-top:8px">Mahsulotlarni savatchaga yig'ing va yangi xarid uchun <b>20% gacha</b> chegirma oling!</p>
    <div style="margin-top:14px" id="startPills"></div>
    <button class="btn main" id="bPlay">O'ynash ▶</button>
    <button class="btn ghost" id="bRules">Qoidalar</button>
  </div>
</section>

<!-- Qoidalar -->
<section class="screen dim" id="sRules">
  <div class="card" id="ruleCard"></div>
</section>

<!-- Daraja kartasi -->
<section class="screen dim" id="sLevel">
  <div class="card" id="levelCard"></div>
</section>

<!-- Daraja yakuni -->
<section class="screen dim" id="sDone">
  <div class="card" id="doneCard"></div>
</section>

// ---------- Parametrlar (bot URL orqali beradi) ----------
const Q = new URLSearchParams(location.search);
const START = Math.min(5, Math.max(1, parseInt(Q.get('start') || '1', 10)));
const BEST = parseInt(Q.get('best') || '0', 10);
const ATT = Q.get('att');

// ---------- Mahsulotlar ----------
const P = {

  osteo:     {name:'OSTEO',     c:'#FF8A00', d:'#C46800', f:'🍊', desc:'Suyaklar'},
  antihelmo: {name:'ANTIHELMO', c:'#1E9BEF', d:'#0B6FC0', f:'🍫', desc:'Gijjaga qarshi'}
};
const PK = Object.keys(P);
const JUNK = [{e:'🍟',n:'Chips'},{e:'🥤',n:'Gazli suv'},{e:'🍭',n:'Konfet'}];

// ---------- Darajalar ----------
const LV = [
  {pct:3,  type:'only', targets:['antihelmo'], need:8,  speed:150, spawn:.95, junk:0,
   hud:'Faqat ANTIHELMO', title:"Faqat ANTIHELMO yig'ing", hint:"Boshqa mahsulotlarni ushlamang"},
  {pct:7,  type:'only', targets:['immuno','osteo'], need:10, speed:180, spawn:.82, junk:.15,
   hud:'IMMUNO va OSTEO', title:"IMMUNO va OSTEO yig'ing", hint:"NEURO, ANTIHELMO va zararli ovqatlardan qoching"},
  {pct:11, type:'all',  targets:PK, need:15, speed:215, spawn:.62, junk:.4,
   hud:'Hammasi, lekin 🍟🥤🍭 emas', title:"Hamma Vitaway mahsulotlarini yig'ing", hint:"Lekin chips, gazli suv va konfetni ushlamang!"},
  {pct:15, type:'seq',  targets:['neuro','immuno','osteo','antihelmo'], need:8, speed:225, spawn:.64, junk:.2,
   hud:'', title:"Tartib bilan yig'ing", hint:"NEURO → IMMUNO → OSTEO → ANTIHELMO, keyin yana boshidan"},

];

// ---------- Canvas ----------
const cv = document.getElementById('game'), cx = cv.getContext('2d');
let W=0,H=0,DPR=1,S=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cx.setTransform(DPR,0,0,DPR,0,0);
  S = Math.max(.8, Math.min(1.35, Math.min(W/390, H/760)));
  if (basket) { basket.y = H - 70*S - safeB(); basket.x = Math.min(Math.max(basket.x, basket.w/2), W-basket.w/2); }
}
function safeB(){ return 14; }
addEventListener('resize', resize);

// ---------- Ovoz ----------
let AC=null, soundOn=true;
function beep(freq, dur=.09, type='sine', vol=.08, slide=0){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sGood=()=>{beep(660,.08,'triangle');setTimeout(()=>beep(990,.1,'triangle'),60)};
const sBad =()=>beep(220,.25,'sawtooth',.06,-120);
const sWin =()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.09),i*110));
const haptic=(k)=>{ try{ if(!tg||!tg.HapticFeedback) return;
  if(k==='ok') tg.HapticFeedback.impactOccurred('light');
  else if(k==='bad') tg.HapticFeedback.notificationOccurred('error');
  else tg.HapticFeedback.notificationOccurred('success'); }catch(e){} };
const sb=document.getElementById('sound');
sb.onclick=()=>{soundOn=!soundOn; sb.textContent=soundOn?'🔊':'🔇';};

// ---------- Chizish yordamchilari ----------

document.querySelectorAll('.logoimg').forEach(e=>e.src=LOGO_SRC);
Object.keys(PACK_SRC).forEach(k=>{const im=new Image(); im.src=PACK_SRC[k]; IMG[k]=im;});

function drawPack(c, key, x, y, s, rot){
  const im=IMG[key];
  if(!im || !im.complete || !im.naturalWidth) return drawPackVector(c,key,x,y,s,rot);
  const h=108*s, w=h*im.naturalWidth/im.naturalHeight;
  c.save(); c.translate(x,y); c.rotate(rot||0);
  c.shadowColor='rgba(11,60,110,.28)'; c.shadowBlur=10*s; c.shadowOffsetY=5*s;
  c.drawImage(im,-w/2,-h/2,w,h);
  c.restore();
}
function drawPackVector(c, key, x, y, s, rot){
  const p=P[key], w=46*s, h=76*s;
  c.save(); c.translate(x,y); c.rotate(rot||0);
  c.shadowColor='rgba(11,60,110,.25)'; c.shadowBlur=10*s; c.shadowOffsetY=5*s;
  // korpus
  c.fillStyle='#fff'; c.beginPath();
  const z=4*s, n=7;
  c.moveTo(-w/2, -h/2+z);
  for(let i=0;i<=n;i++){ c.lineTo(-w/2 + w*i/n, -h/2 + (i%2?0:z)); }
  c.lineTo(w/2, h/2-z);
  for(let i=n;i>=0;i--){ c.lineTo(-w/2 + w*i/n, h/2 - (i%2?0:z)); }
  c.closePath(); c.fill();
  c.shadowColor='transparent';
  // rangli yuqori qism (to'lqin bilan)
  c.save(); c.clip();
  c.fillStyle=p.c; c.beginPath(); c.moveTo(-w/2,-h/2); c.lineTo(w/2,-h/2); c.lineTo(w/2,-h*.02);
  c.bezierCurveTo(w*.15,-h*.12, -w*.1,h*.08, -w/2,-h*.04); c.closePath(); c.fill();
  c.fillStyle='rgba(255,255,255,.25)'; c.fillRect(-w/2,-h/2,w*.18,h);
  c.restore();
  // meva
  c.font=(20*s)+'px serif'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(p.f, 0, -h*.27);
  // matn
  c.fillStyle=p.d; c.font='700 '+(8.2*s)+'px Fredoka, sans-serif';
  c.fillText('VITAWAY', 0, h*.13);
  c.font='700 '+(p.name.length>6?6.6*s:8*s)+'px Fredoka, sans-serif';
  c.fillText(p.name, 0, h*.27);
  c.restore();
}
function drawJunk(c, e, x, y, s, rot){
  c.save(); c.translate(x,y); c.rotate(rot||0);
  c.font=(44*s)+'px serif'; c.textAlign='center'; c.textBaseline='middle';
  c.shadowColor='rgba(0,0,0,.2)'; c.shadowBlur=8*s; c.shadowOffsetY=4*s;
  c.fillText(e,0,0); c.restore();
}
function drawBasket(b){
  const x=b.x, y=b.y, w=b.w, h=b.h, sq=b.squash;
  cx.save(); cx.translate(x,y); cx.scale(1+sq*.12, 1-sq*.12);
  // soya
  cx.fillStyle='rgba(11,60,110,.15)'; cx.beginPath(); cx.ellipse(0,h*.62,w*.5,h*.12,0,0,7); cx.fill();
  // tutqich
  cx.strokeStyle='#0B6FC0'; cx.lineWidth=7*S; cx.lineCap='round';
  cx.beginPath(); cx.arc(0,-h*.35,w*.36,Math.PI*1.08,Math.PI*1.92); cx.stroke();
  // savat tanasi
  const g=cx.createLinearGradient(0,-h/2,0,h/2); g.addColorStop(0,'#3FB0F7'); g.addColorStop(1,'#0B6FC0');
  cx.fillStyle=g; cx.beginPath();
  cx.moveTo(-w/2,-h*.35); cx.lineTo(w/2,-h*.35); cx.lineTo(w*.4,h*.5); cx.quadraticCurveTo(0,h*.6,-w*.4,h*.5); cx.closePath(); cx.fill();
  // to'qima chiziqlar
  cx.save(); cx.clip(); cx.strokeStyle='rgba(255,255,255,.18)'; cx.lineWidth=2*S;
  for(let i=-6;i<=6;i++){cx.beginPath();cx.moveTo(i*w/10,-h);cx.lineTo(i*w/10+h*.4,h);cx.stroke();}
  cx.restore();
  // oq lenta
  cx.fillStyle='#fff'; rr(-w*.47,-h*.16,w*.94,h*.4,9*S); cx.fill();
  if(LOGOIMG.complete&&LOGOIMG.naturalWidth){ const lw=w*.7, lh=lw*LOGOIMG.naturalHeight/LOGOIMG.naturalWidth; cx.drawImage(LOGOIMG,-lw/2,h*.04-lh/2,lw,lh); }
  else { cx.fillStyle='#1E9BEF'; cx.font='700 '+(15*S)+'px Fredoka, system-ui, sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText('VITAWAY',0,h*.03); }
  // gardish
  cx.fillStyle='#0B6FC0'; rr(-w/2-3*S,-h*.42,w+6*S,h*.12,6*S); cx.fill();
  // ichidagi mahsulotlar (yig'ilgani)
  cx.restore();
}

const blobs=[];
function initBlobs(){
  blobs.length=0;
  const cols=['#A9D2F0','#F2C311','#B5CB25','#1E9BEF','#F3E2A9','#FF8A00'];
  const pos=[[.05,.08],[.5,.02],[.95,.1],[.02,.95],[.5,1],[.98,.92]];
  pos.forEach((p,i)=>blobs.push({x:p[0],y:p[1],r:.32+.08*Math.random(),c:cols[i],ph:Math.random()*6}));
}
function drawBG(t){
  cx.fillStyle='#F4F9FD'; cx.fillRect(0,0,W,H);
  blobs.forEach(b=>{
    cx.globalAlpha=(running||paused)?.32:.55; cx.fillStyle=b.c; cx.beginPath();
    const R=b.r*Math.min(W,H)*1.1, X=b.x*W+Math.sin(t*.4+b.ph)*12, Y=b.y*H+Math.cos(t*.35+b.ph)*12;
    for(let a=0;a<=Math.PI*2+.01;a+=Math.PI/24){
      const rr2=R*(1+.07*Math.sin(a*3+t*.8+b.ph));
      const px=X+Math.cos(a)*rr2, py=Y+Math.sin(a)*rr2;
      a===0?cx.moveTo(px,py):cx.lineTo(px,py);
    }
    cx.fill();
  });
  cx.globalAlpha=1;
}

let basket=null, items=[], parts=[], floats=[];
let level=START, lives=3, got=0, seqIdx=0, counts={}, spawnT=0, running=false, last=0, shake=0, flash=0;
let earnedPct = 0;            // shu urinishda qo'lga kiritilgan

function isGood(kind){
  const L=LV[level-1];
  if(kind==='junk') return false;
  if(L.type==='only') return L.targets.includes(kind);
  if(L.type==='all') return true;
  if(L.type==='seq') return kind===L.targets[seqIdx%4];
  if(L.type==='exact') return (L.counts[kind]||0) > (counts[kind]||0);
  return false;
}
function wrongMsg(kind){
  const L=LV[level-1];
  if(kind==='junk') return "Zararli ovqat! Ushlamang";
  if(L.type==='seq') return "Hozir "+P[L.targets[seqIdx%4]].name+" navbati";
  if(L.type==='exact') return L.counts[kind] ? P[kind].name+" yetarli, ortig'i kerak emas" : "Bu "+P[kind].name+" edi";
  return "Bu "+P[kind].name+" edi";
}
function pickKind(){
  const L=LV[level-1];
  if(Math.random()<L.junk) return 'junk';
  if(L.type==='only' && Math.random()<.5) return L.targets[Math.floor(Math.random()*L.targets.length)];
  if(L.type==='seq' && Math.random()<.42) return L.targets[seqIdx%4];
  if(L.type==='exact'){
    const need=L.targets.filter(k=>(counts[k]||0)<L.counts[k]);
    if(need.length && Math.random()<.45) return need[Math.floor(Math.random()*need.length)];
  }
  return PK[Math.floor(Math.random()*4)];
}
function spawn(){
  const L=LV[level-1], kind=pickKind();
  const m=34*S;
  items.push({kind, e: kind==='junk'? JUNK[Math.floor(Math.random()*3)].e : null,
    x: m+Math.random()*(W-2*m), y:-50*S, vy:(L.speed*(.85+Math.random()*.3))*(H/760),
    rot: kind==='junk'?(Math.random()-.5)*.6:(Math.random()-.5)*.16, vr: kind==='junk'?(Math.random()-.5)*1.6:0, sw:Math.random()*6});
}
function burst(x,y,col,n=14){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2, v=(80+Math.random()*160)*S;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60*S,life:.7,c:col,r:(3+Math.random()*4)*S});}
}
function floatTxt(x,y,txt,col){ floats.push({x,y,txt,col,life:1}); }

function toast(m){const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1300);}

function catchItem(it){
  const k=it.kind;
  if(isGood(k)){
    got++; score+=10*level;
    if(LV[level-1].type==='seq') seqIdx++;
    if(LV[level-1].type==='exact') counts[k]=(counts[k]||0)+1;
    burst(it.x,it.y,P[k].c); floatTxt(it.x,it.y-20*S,'+1',P[k].d);
    basket.squash=1; sGood(); haptic('ok');
    if(got>=LV[level-1].need) levelDone();
  }else{
    lives--; shake=.35; flash=.35; sBad(); haptic('bad');
    burst(it.x,it.y,'#E5484D',10); floatTxt(it.x,it.y-20*S,'−❤','#E5484D');
    toast(wrongMsg(k));
    if(lives<=0) levelFail();
  }
}

// ---------- Kiritish ----------
function setTarget(px){ if(basket) basket.tx=Math.min(Math.max(px, basket.w/2), W-basket.w/2); }
cv.addEventListener('pointerdown',e=>{setTarget(e.clientX); cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') setTarget(e.clientX); });
const keys={};
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);
document.addEventListener('visibilitychange',()=>{ if(document.hidden && running){ running=false; paused=true; } else if(!document.hidden && paused){ paused=false; running=true; last=performance.now(); } });
let paused=false;

// ---------- HUD ----------
function drawHUD(){
  const L=LV[level-1], top=10+(tg&&tg.safeAreaInset?tg.safeAreaInset.top:0);
  // panel
  cx.fillStyle='rgba(255,255,255,.92)'; rr(10,top,W-20,86*S,18*S); cx.fill();
  cx.fillStyle='#1E9BEF'; rr(20,top+10*S,62*S,24*S,12*S); cx.fill();
  cx.fillStyle='#fff'; cx.font='600 '+(13*S)+'px Fredoka, system-ui, sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(level+'/5', 20+31*S, top+22*S);
  // jonlar
  cx.textAlign='right'; cx.font=(18*S)+'px serif';
  cx.fillText('❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(3-Math.max(0,lives)), W-22, top+23*S);
  // shart
  cx.textAlign='left'; cx.fillStyle='#17324D'; cx.font='600 '+(14*S)+'px Fredoka, system-ui, sans-serif';
  let txt=L.hud;
  if(L.type==='seq') txt='Navbat: '+P[L.targets[seqIdx%4]].name;
  if(L.type==='exact') txt='NEURO '+(counts.neuro||0)+'/4 · ANTIHELMO '+(counts.antihelmo||0)+'/4';
  cx.fillText(txt, 92*S, top+22*S, W-92*S-104*S);
  // progress
  const bx=20, by=top+48*S, bw=W-40, bh=14*S;
  cx.fillStyle='#E3EFF9'; rr(bx,by,bw,bh,7*S); cx.fill();
  const g=cx.createLinearGradient(bx,0,bx+bw,0); g.addColorStop(0,'#1E9BEF'); g.addColorStop(1,'#9BC53D');
  cx.fillStyle=g; rr(bx,by,Math.max(bh,bw*got/L.need),bh,7*S); cx.fill();
  cx.fillStyle='#5A7690'; cx.font='500 '+(12*S)+'px Fredoka, system-ui, sans-serif'; cx.textAlign='left';
  cx.fillText(got+' / '+L.need, bx, by+bh+11*S);
  cx.textAlign='right'; cx.fillStyle='#C46800';
  cx.fillText('🎁 Yutuq: '+L.pct+'%', bx+bw, by+bh+11*S);
}

// ---------- Asosiy sikl ----------
function loop(now){
  requestAnimationFrame(loop);
  const t=now/1000;
  let dt=Math.min(.033,(now-last)/1000||0); last=now;
  if(!running) dt=0;
  cx.save();
  if(shake>0){ cx.translate((Math.random()-.5)*12*shake,(Math.random()-.5)*12*shake); shake-=dt; }
  drawBG(t);
  if(basket){
    if(keys.ArrowLeft) setTarget(basket.tx-520*dt); if(keys.ArrowRight) setTarget(basket.tx+520*dt);
    basket.x += (basket.tx-basket.x)*Math.min(1,dt*18 || .2);
    basket.squash=Math.max(0,basket.squash-dt*5);
  }
  if(running){
    spawnT-=dt; if(spawnT<=0){ spawn(); spawnT=LV[level-1].spawn*(.75+Math.random()*.5); }
  }
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; if(!it) continue;
    it.y+=it.vy*dt; it.rot+=it.vr*dt; it.x+=Math.sin(t*2+it.sw)*12*dt;
    if(running && basket && it.y>basket.y-basket.h*.5 && it.y<basket.y+basket.h*.1 && Math.abs(it.x-basket.x)<basket.w*.48){
      items.splice(i,1); catchItem(it); continue;
    }
    if(it.y>H+60*S){ items.splice(i,1); continue; }
    if(it.kind==='junk') drawJunk(cx,it.e,it.x,it.y,S,it.rot); else drawPack(cx,it.kind,it.x,it.y,S,it.rot+Math.sin(t*1.6+it.sw)*.06);
  }
  if(basket) drawBasket(basket);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.life-=dt||.016; if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*(dt||.016); p.y+=p.vy*(dt||.016); p.vy+=500*S*(dt||.016);
    cx.globalAlpha=Math.max(0,p.life/.7); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); }
  cx.globalAlpha=1;
  for(let i=floats.length-1;i>=0;i--){const f=floats[i]; f.life-=dt||.016; if(f.life<=0){floats.splice(i,1);continue;}
    f.y-=50*S*(dt||.016); cx.globalAlpha=f.life; cx.fillStyle=f.col; cx.font='700 '+(22*S)+'px Fredoka, system-ui, sans-serif'; cx.textAlign='center'; cx.fillText(f.txt,f.x,f.y); }
  cx.globalAlpha=1;
  if(basket && (running||paused)) drawHUD();
  if(flash>0){ cx.fillStyle='rgba(229,72,77,'+(flash*.5)+')'; cx.fillRect(0,0,W,H); flash-=dt; }
  confettiStep(dt||.016);
  cx.restore();
}

// ---------- Konfetti ----------
const conf=[];
function confetti(){ const cols=['#1E9BEF','#F2C311','#9BC53D','#FF8A00','#fff'];
  for(let i=0;i<120;i++) conf.push({x:W/2+(Math.random()-.5)*60,y:H*.35,vx:(Math.random()-.5)*700,vy:-300-Math.random()*500,r:Math.random()*6,c:cols[i%5],a:Math.random()*6,life:2.2}); }
function confettiStep(dt){ for(let i=conf.length-1;i>=0;i--){const p=conf[i]; p.life-=dt; if(p.life<=0){conf.splice(i,1);continue;}
  p.vy+=900*dt; p.vx*=.99; p.x+=p.vx*dt; p.y+=p.vy*dt; p.a+=dt*8;
  cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.globalAlpha=Math.min(1,p.life); cx.fillRect(-4,-2.5,8+p.r,5); cx.restore(); } }

// ---------- Ekranlar ----------
const $=id=>document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); if(id) $(id).classList.add('on'); }
function packCanvas(key, s=1){ const c=document.createElement('canvas'), w=50*s, h=112*s, d=Math.min(devicePixelRatio||1,2.5);
  c.width=w*d; c.height=h*d; c.style.width=w+'px'; c.style.height=h+'px'; const g=c.getContext('2d'); g.scale(d,d); drawPack(g,key,w/2,h/2,s*.96,0); return c; }
function prodRow(keys, s=.9){ const row=document.createElement('div'); row.className='prods';
  keys.forEach(k=>{ const d=document.createElement('div'); d.className='prod'; d.appendChild(packCanvas(k,s));
    d.insertAdjacentHTML('beforeend', P[k].name+'<small>'+P[k].desc+'</small>'); row.appendChild(d); }); return row; }

// Boshlash ekrani
(function(){
  const pills=$('startPills'); let h='';
  if(BEST>0) h+='<span class="pill">🎁 Hozirgi chegirma: '+BEST+'%</span>';
  if(ATT!==null) h+='<span class="pill">🎮 Urinishlar: '+ATT+'</span>';
  if(START>1) h+='<span class="pill">▶ '+START+'-darajadan davom etasiz</span>';
  pills.innerHTML=h;
})();

// Qoidalar
const RULES=[
  ()=>`<div class="illu"><div class="basketmini"></div><div class="hand">👆</div></div>
       <h3 class="big">Savatchani suring</h3><p class="muted" style="margin-top:8px">Barmog'ingizni ekranda chapga va o'ngga yuriting, savatcha orqangizdan boradi.</p>`,
  ()=>`<h3 class="big">Shartni o'qing 📋</h3><p class="muted" style="margin-top:8px">Har daraja boshida shart chiqadi. Faqat kerakli mahsulotlarni ushlang.</p><div id="rp"></div>`,
  ()=>`<div class="illu"><span class="heartbeat">❤️❤️❤️</span></div><h3 class="big">3 ta jon</h3>
       <p class="muted" style="margin-top:8px">Noto'g'ri mahsulot yoki zararli ovqatni ushlasangiz, bitta jon ketadi.</p><div class="junkrow">🍟🥤🍭</div>`,
  ()=>`<h3 class="big">5 daraja, 20% gacha 🎁</h3><p class="muted" style="margin-top:8px">Har bir daraja chegirmani oshiradi. Istalgan payt to'xtab, yutgan foizingizni olishingiz mumkin.</p>
       <div class="ladder">${LV.map((l,i)=>`<div style="background:${['#9BC53D','#1E9BEF','#F2C311','#FF8A00','#E5484D'][i]};animation-delay:${i*.12}s">${l.pct}%</div>`).join('')}</div>`
];
let ruleI=0, rulesThen=null;
function renderRule(){
  const c=$('ruleCard');
  c.innerHTML=RULES[ruleI]()+`<div class="steps">${RULES.map((_,i)=>`<i class="${i===ruleI?'on':''}"></i>`).join('')}</div>
    <button class="btn main" id="rNext">${ruleI<RULES.length-1?'Keyingisi →':'Tushunarli! ✅'}</button>
    ${ruleI<RULES.length-1?'<button class="btn ghost" id="rSkip">O\'tkazib yuborish</button>':''}`;
  if(ruleI===1) $('rp').appendChild(prodRow(PK,.82));
  c.style.animation='none'; c.offsetHeight; c.style.animation='';
  $('rNext').onclick=()=>{ if(ruleI<RULES.length-1){ruleI++; renderRule(); beep(520,.06,'triangle');} else finishRules(); };
  const sk=$('rSkip'); if(sk) sk.onclick=finishRules;
}
function openRules(then){ ruleI=0; rulesThen=then||null; show('sRules'); renderRule(); }
function finishRules(){ if(rulesThen){ const f=rulesThen; rulesThen=null; f(); } else show('sStart'); }

$('bRules').onclick=()=>openRules(null);
$('bPlay').onclick=()=>{
  beep(1,.01); sb.style.display='block';
  let seen=false; try{ seen=localStorage.getItem('vw_rules')==='1'; }catch(e){}
  if(!seen){ try{ localStorage.setItem('vw_rules','1'); }catch(e){} openRules(()=>levelIntro()); }
  else levelIntro();
};

// Daraja kartasi
function levelIntro(){
  const L=LV[level-1], c=$('levelCard');
  running=false; items=[];
  c.innerHTML=`<span class="lvl">${level}-DARAJA</span>
    <h3 class="big" style="margin-top:12px">${L.title}</h3>
    <p class="muted" style="margin-top:6px">${L.hint}</p><div id="lp"></div>
    ${L.junk>0?'<p class="muted" style="margin-top:6px">Qoching: <span style="font-size:22px">🍟🥤🍭</span></p>':''}
    <p style="margin-top:10px;font-weight:600">Yutuq: <span style="color:#FF8A00;font-size:22px">${L.pct}%</span> chegirma</p>
    <button class="btn main" id="lGo">Boshladik! 🚀</button>`;
  $('lp').appendChild(prodRow(L.targets, L.targets.length>2?.78:.95));
  show('sLevel');
  $('lGo').onclick=()=>{ show(null); countdown(startLevel); };
}
function countdown(cb){
  const el=$('count'); el.classList.add('on'); let n=3;
  const tick=()=>{ if(n===0){ el.innerHTML='<span>Go!</span>'; beep(880,.15,'triangle'); setTimeout(()=>{el.classList.remove('on'); cb();},500); return; }
    el.innerHTML='<span>'+n+'</span>'; beep(440,.08,'triangle'); n--; setTimeout(tick,700); };
  tick();
}
function startLevel(){ lives=3; got=0; seqIdx=0; counts={}; items=[]; spawnT=.4; lvT0=Date.now(); running=true; last=performance.now(); }

function levelDone(){
  running=false; items=[]; document.getElementById('toast').classList.remove('on');
  const L=LV[level-1];
  earnedPct=Math.max(earnedPct,L.pct); reachedLevel=level;
  lvLog.push({l:level,ok:1,s:Math.round((Date.now()-lvT0)/1000)});
  sWin(); haptic('win'); confetti();
  const c=$('doneCard'), last=level===5;
  const total=Math.max(BEST,earnedPct);
  c.innerHTML=`<div style="font-size:54px">${last?'🏆':'🎉'}</div>
    <h3 class="big">${last?'Barcha darajalar yakunlandi!':level+'-daraja yakunlandi!'}</h3>
    <p class="muted" style="margin-top:8px">Siz qo'lga kiritgan chegirma</p>
    <div class="pct" style="margin-top:6px">${total}%</div>
    ${last?`<p class="muted" style="margin-top:10px">Bu eng yuqori chegirma. Natijani yuboring, chegirma kodingiz botga keladi.</p>
       <button class="btn orange" id="dSend">Natijani yuborish 🎁</button>`
     :`<p class="muted" style="margin-top:10px">Keyingi darajada <b style="color:#FF8A00">${LV[level].pct}%</b> gacha oshirishingiz mumkin.</p>
       <button class="btn main" id="dNext">Keyingi daraja ▶</button>
       <button class="btn ghost" id="dSend">To'xtash va ${total}% ni olish</button>`}`;
  show('sDone');
  const nx=$('dNext'); if(nx) nx.onclick=()=>{ level++; levelIntro(); };
  $('dSend').onclick=()=>sendResult(last?'all':'stop');
}
function levelFail(){
  running=false; items=[];
  lvLog.push({l:level,ok:0,s:Math.round((Date.now()-lvT0)/1000)});
  const total=Math.max(BEST,earnedPct);
  const c=$('doneCard');
  c.innerHTML=`<div style="font-size:54px">💔</div><h3 class="big">Jonlar tugadi</h3>
    <p class="muted" style="margin-top:8px">${level}-darajani keyingi urinishda yana o'ynab ko'rasiz.</p>
    <p class="muted" style="margin-top:14px">Sizning chegirmangiz</p><div class="pct" style="margin-top:6px">${total}%</div>
    <button class="btn main" id="dSend">Natijani yuborish</button>`;
  show('sDone');
  $('dSend').onclick=()=>sendResult('fail');
}

function sendResult(how){
  const data={t:'game', v:1, start:START, reached:reachedLevel, pct:earnedPct, how,
    score, dur:Math.round((Date.now()-t0)/1000), lv:lvLog};
  const json=JSON.stringify(data);
  if(inTG){ try{ tg.sendData(json); return; }catch(e){} }
  // Brauzerdagi namuna rejimi
  const total=Math.max(BEST,earnedPct);
  $('doneCard').innerHTML=`<div style="font-size:48px">📨</div><h3 class="big">Natija botga yuboriladi</h3>
    <p class="muted" style="margin-top:8px">Bu namuna rejimi. Telegram ichida o'yin shu yerda yopiladi va bot quyidagini yozadi:</p>
    <p style="margin-top:12px;font-weight:600">"Tabriklaymiz! Siz ${total}% chegirma qo'lga kiritdingiz."</p>
    ${total>0?`<div class="code">VW-${total}-${Math.floor(1000+Math.random()*9000)}</div>`:''}
    <button class="btn main" id="again">Qaytadan o'ynash</button>`;
  $('again').onclick=()=>location.reload();
}

if(Q.get('debug')==='1') window.__vw=()=>({items:items.map(i=>({k:i.kind,x:i.x,y:i.y,good:isGood(i.kind)})),level,got,lives,running,bx:basket.x,by:basket.y});
// ---------- Ishga tushirish ----------
initBlobs(); resize(); newBasket();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{});
requestAnimationFrame(t=>{last=t; loop(t);});
})();
</script>
